# Striso Live, Flutter desktop app: tests (with the audio engine's native self-test), then the
# Windows and macOS builds, uploaded as workflow artifacts. Tagged releases: release.yml. Unsigned builds; README.md says how to open them past
# SmartScreen/Gatekeeper.
name: Striso Live (Flutter)

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.41.2"
  LIBUSB_VERSION: "1.0.30"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Firmware source next to the app, for the cross-checks (optional)
        # parameter names, settings map, config writer vs tools/striso.py; the tests look in
        # ../striso-control-firmware (or $STRISO_FW_DIR) and skip with a message without it
        continue-on-error: true
        run: git clone --quiet --depth 1 --branch main https://github.com/aidin-foroughi/striso-control-firmware.git ../striso-control-firmware

      - uses: subosito/flutter-action@1a449444c387b1966244ae4d4f8c696479add0b2 # v2.23.0
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Firmware tools venv for the config reference test (tools/striso.py imports pyusb)
        run: |
          t=../striso-control-firmware/tools
          if [ ! -f "$t/requirements.txt" ]; then echo "no $t/requirements.txt: the config reference test will skip"; exit 0; fi
          python -m venv "$t/.venv"
          if [ -f "$t/.venv/Scripts/python.exe" ]; then PY="$t/.venv/Scripts/python.exe"; else PY="$t/.venv/bin/python"; fi
          "$PY" -m pip install --quiet -r "$t/requirements.txt"

      - name: Get packages (the app's and each package's own; flutter analyze reads their tests too)
        run: |
          flutter pub get
          for p in packages/*/; do (cd "$p" && dart pub get); done

      - name: Core tests (dart test)
        working-directory: packages/striso_core
        run: dart test -r expanded

      - name: Audio engine, native self-test (passthrough, drift servo, resampler, WAV; null backend)
        run: |
          if [ "$RUNNER_OS" = Windows ]; then
            cmake -S packages/striso_audio/native -B build/striso_audio
            cmake --build build/striso_audio --config Release
            build/striso_audio/Release/striso_audio_check.exe --selftest "$RUNNER_TEMP"
          else
            sh packages/striso_audio/native/build_macos.sh --selftest
          fi

      - name: Audio package tests (state machine; the dart:ffi binding on the null backend)
        working-directory: packages/striso_audio
        run: dart test -r expanded

      - name: Bench tests (measurement math, the simulated board; no hardware)
        working-directory: packages/striso_bench
        run: dart test -r expanded

      - name: Bench, simulated end to end (null backend, simulated board, JSON report)
        working-directory: packages/striso_bench
        run: dart run bin/striso_bench.dart all --sim --n 20 --seconds 3 --minutes 0.05 --out-seconds 0.5 --json "$RUNNER_TEMP/bench-sim.json" > /dev/null

      - name: Analyze
        run: |
          flutter analyze
          (cd packages/striso_usb && dart analyze)
          (cd packages/striso_audio && dart analyze)
          (cd packages/striso_bench && dart analyze)

      - name: Widget and controller tests (headless)
        run: flutter test

      # ---------------------------------------------------------------- Windows
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: flutter build windows --release

      - name: Smoke run (Windows, demo board, no USB, hidden window)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:STRISO_LIVE_HOME = "$env:RUNNER_TEMP\striso-live-smoke"
          $p = Start-Process -FilePath build\windows\x64\runner\Release\StrisoLive.exe -ArgumentList '--smoke=5','--no-usb','--virtual' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'smoke run did not quit' }
          Get-Content "$env:STRISO_LIVE_HOME\logs\striso-live.log"
          if ($p.ExitCode -ne 0) { throw "smoke run exit code $($p.ExitCode)" }
          if (-not (Select-String -Path "$env:STRISO_LIVE_HOME\logs\striso-live.log" -Pattern 'smoke: ok')) { throw 'no smoke line' }
          if (-not (Select-String -Path "$env:STRISO_LIVE_HOME\logs\striso-live.log" -Pattern 'audio: engine striso_audio')) { throw 'striso_audio.dll did not load' }

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/package_windows.ps1

      # ---------------------------------------------------------------- macOS
      - name: libusb, universal (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL -o libusb.tar.bz2 "https://github.com/libusb/libusb/releases/download/v${LIBUSB_VERSION}/libusb-${LIBUSB_VERSION}.tar.bz2"
          tar xjf libusb.tar.bz2
          cd "libusb-${LIBUSB_VERSION}"
          ./configure --disable-dependency-tracking --disable-static --prefix="$RUNNER_TEMP/libusb" \
            CFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=11.0 -O2" LDFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=11.0"
          make -j4
          make install
          lipo -archs "$RUNNER_TEMP/libusb/lib/libusb-1.0.0.dylib"

      - name: Build and package (macOS; striso_audio is built universal into the bundle)
        if: runner.os == 'macOS'
        run: |
          flutter build macos --release
          sh tool/package_macos.sh "$RUNNER_TEMP/libusb/lib/libusb-1.0.0.dylib"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: striso-live-flutter-${{ runner.os }}
          path: |
            dist/*.zip
            dist/*.dmg
          if-no-files-found: error
