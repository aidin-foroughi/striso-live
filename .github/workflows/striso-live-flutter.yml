# Striso Live, Flutter desktop app (tools/striso_live): tests, then the Windows and macOS builds.
# Unsigned builds; tools/striso_live/README.md says how to open them past SmartScreen/Gatekeeper.
name: Striso Live (Flutter)

on:
  workflow_dispatch:
  push:
    paths:
      - "tools/striso_live/**"
      - ".github/workflows/striso-live-flutter.yml"
  pull_request:
    paths:
      - "tools/striso_live/**"

env:
  FLUTTER_VERSION: "3.41.2"
  LIBUSB_VERSION: "1.0.30"

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: tools/striso_live
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Python for the config reference test
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: tools/.venv for the config reference test (tools/striso.py imports pyusb)
        working-directory: tools
        run: |
          python -m venv .venv
          if [ -f .venv/Scripts/python.exe ]; then PY=.venv/Scripts/python.exe; else PY=.venv/bin/python; fi
          "$PY" -m pip install --quiet pyusb libusb_package

      - name: Get packages
        run: flutter pub get

      - name: Core tests (dart test)
        working-directory: tools/striso_live/packages/striso_core
        run: dart test -r expanded

      - name: Analyze
        run: |
          flutter analyze
          (cd packages/striso_usb && dart analyze)

      - name: Widget and controller tests (headless)
        run: flutter test

      # ---------------------------------------------------------------- Windows
      - name: Build (Windows)
        if: runner.os == 'Windows'
        run: flutter build windows --release

      - name: Smoke run (Windows, demo board, no USB, hidden window)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:STRISO_LIVE_HOME = "$env:RUNNER_TEMP\striso-live-smoke"
          $p = Start-Process -FilePath build\windows\x64\runner\Release\StrisoLive.exe -ArgumentList '--smoke=5','--no-usb','--demo' -PassThru
          if (-not $p.WaitForExit(60000)) { $p.Kill(); throw 'smoke run did not quit' }
          Get-Content "$env:STRISO_LIVE_HOME\logs\striso-live.log"
          if ($p.ExitCode -ne 0) { throw "smoke run exit code $($p.ExitCode)" }
          if (-not (Select-String -Path "$env:STRISO_LIVE_HOME\logs\striso-live.log" -Pattern 'smoke: ok')) { throw 'no smoke line' }

      - name: Package (Windows zip)
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./tool/package_windows.ps1

      - name: Installer (Windows, Inno Setup)
        if: runner.os == 'Windows'
        continue-on-error: true
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue)) {
            $inno = 'C:\Program Files (x86)\Inno Setup 6'
            if (-not (Test-Path "$inno\iscc.exe")) { choco install innosetup -y --no-progress }
            $env:PATH = "$inno;$env:PATH"
          }
          $version = (Select-String -Path pubspec.yaml -Pattern '^version:\s*([0-9.]+)').Matches[0].Groups[1].Value
          iscc "/DAppVersion=$version" tool\installer.iss

      # ---------------------------------------------------------------- macOS
      - name: libusb, universal (macOS)
        if: runner.os == 'macOS'
        run: |
          set -e
          cd "$RUNNER_TEMP"
          curl -fsSL -o libusb.tar.bz2 "https://github.com/libusb/libusb/releases/download/v${LIBUSB_VERSION}/libusb-${LIBUSB_VERSION}.tar.bz2"
          tar xjf libusb.tar.bz2
          cd "libusb-${LIBUSB_VERSION}"
          ./configure --disable-dependency-tracking --disable-static --prefix="$RUNNER_TEMP/libusb" \
            CFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=10.15 -O2" LDFLAGS="-arch arm64 -arch x86_64 -mmacosx-version-min=10.15"
          make -j4
          make install
          lipo -archs "$RUNNER_TEMP/libusb/lib/libusb-1.0.0.dylib"

      - name: Build (macOS)
        if: runner.os == 'macOS'
        run: |
          flutter build macos --release
          sh tool/bundle_libusb_macos.sh "build/macos/Build/Products/Release/Striso Live.app" "$RUNNER_TEMP/libusb/lib/libusb-1.0.0.dylib"
          version=$(sed -n 's/^version: *\([0-9.]*\).*/\1/p' pubspec.yaml)
          mkdir -p dist
          ditto -c -k --keepParent "build/macos/Build/Products/Release/Striso Live.app" "dist/StrisoLive-${version}-macos.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: striso-live-flutter-${{ runner.os }}
          path: |
            tools/striso_live/dist/*.zip
            tools/striso_live/dist/*.exe
          if-no-files-found: error
