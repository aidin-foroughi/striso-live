name: striso_live
description: "Striso Live: live companion for the Striso board"
publish_to: 'none'
version: 1.3.0+4

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  file_selector: ^1.0.3
  archive: ^4.0.7
  crypto: ^3.0.6
  striso_core:
    path: packages/striso_core
  striso_usb:
    path: packages/striso_usb
  striso_audio:
    path: packages/striso_audio
  striso_virtual:
    path: packages/striso_virtual

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  fake_async: ^1.3.0

flutter:
  uses-material-design: true
  assets:
    - assets/fonts/OFL.txt
  # Inter (variable, SIL Open Font License 1.1: assets/fonts/OFL.txt), the same metrics on
  # Windows and macOS
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter.ttf
